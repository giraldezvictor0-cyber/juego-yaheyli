<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Nuestra historia todavía tiene páginas por escribir - Una experiencia interactiva para Yaheyli">
    <title>Nuestra historia todavía tiene páginas por escribir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <!-- Favicon pixel-art inline SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231a1a2e' width='32' height='32'/%3E%3Cpath fill='%23ffd700' d='M16 2 L20 10 L30 10 L22 16 L26 26 L16 20 L6 26 L10 16 L2 10 L12 10 Z'/%3E%3Ccircle fill='%23ff4466' cx='16' cy='14' r='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading-screen" aria-hidden="true">
        <div class="loading-text">CARGANDO...</div>
        <div class="loading-bar"><div id="loading-fill" class="loading-fill"></div></div>
    </div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
    </div>
    <div id="audio-player" class="hidden" aria-label="Reproductor de música">
        <div class="player-header">
            <span class="player-title">CANCIONES QUE ME RECUERDAN A TI</span>
            <button id="player-close" class="pixel-btn" aria-label="Cerrar reproductor">×</button>
        </div>
        <div class="player-track-info">
            <span id="current-track-name" class="track-name">No One Noticed (Extended Spanish) — The Marías</span>
            <span id="current-track-time" class="track-time">0:00 / 0:00</span>
        </div>
        <div class="player-progress">
            <div id="progress-bar" class="progress-bar" role="slider" aria-label="Progreso de la canción" tabindex="0">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>
        <div class="player-controls">
            <button id="btn-prev" class="pixel-btn" aria-label="Anterior">◄◄</button>
            <button id="btn-play-pause" class="pixel-btn" aria-label="Reproducir">►</button>
            <button id="btn-next" class="pixel-btn" aria-label="Siguiente">►►</button>
            <button id="btn-volume" class="pixel-btn" aria-label="Volumen">♪</button>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="70" aria-label="Control de volumen">
        </div>
        <div class="player-playlist">
            <div class="playlist-header">PLAYLIST</div>
            <ul id="playlist" class="playlist-tracks"></ul>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
